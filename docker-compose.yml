services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: pantryai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantryai_dev
      POSTGRES_USER: pantryai
      POSTGRES_PASSWORD: pantryai
    ports:
      - '${PGHOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pantryai -d pantryai_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Test database (separate from pantryai_dev to protect dev data)
  postgres_test:
    image: docker.io/library/postgres:17-alpine
    container_name: pantryai_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantryai_test
      POSTGRES_USER: pantryai
      POSTGRES_PASSWORD: pantryai
    ports:
      - '${PGTEST_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pantryai -d pantryai_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pantryai_redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
