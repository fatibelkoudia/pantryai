services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: pantryai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantryai_dev
      POSTGRES_USER: pantryai
      POSTGRES_PASSWORD: pantryai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pantryai -d pantryai_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pantryai_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
