name: CI

# Runs on every push (lint + type-check + unit tests + build) and adds the
# integration suite on pull requests, where we spin up real Postgres + Redis
# service containers (mirroring docker-compose.test.yml).
on:
  push:
    branches: ['**']
  pull_request:

# Cancel an in-progress run if a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo is happy with these even when there's no remote cache configured.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (informational)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      # The api and web packages type-check against shared/dist, so build it first.
      - name: Build shared package
        run: pnpm --filter @pantryai/shared build

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      # --coverage enforces the thresholds declared in vitest.config.ts
      # (60% overall, 80% on services). Falling below fails the job.
      - name: Unit tests + coverage (api)
        run: pnpm --filter @pantryai/api test:unit:coverage

      - name: Upload coverage report (unit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-unit
          path: packages/api/coverage/
          retention-days: 30

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    # Integration flows hit a real DB, so only run them on PRs to keep pushes fast.
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pantryai_test
          POSTGRES_USER: pantryai
          POSTGRES_PASSWORD: pantryai
        ports:
          # Same port the test setup expects (docker-compose.test.yml).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pantryai -d pantryai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both the migrate step and the test app point at the throwaway test DB.
      DATABASE_TEST_URL: postgresql://pantryai:pantryai@localhost:5433/pantryai_test
      DATABASE_DIRECT_URL: postgresql://pantryai:pantryai@localhost:5433/pantryai_test
      DATABASE_TRANSACTION_POOLER_URL: postgresql://pantryai:pantryai@localhost:5433/pantryai_test
      REDIS_HOST: localhost
      REDIS_PORT: '6380'
      # Placeholder secrets so env validation passes at boot. The integration
      # tests stub the real Mistral/R2 calls, so these never leave the runner.
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
      MISTRAL_API_KEY: ci-test-mistral-key
      R2_ENDPOINT: https://ci.test.r2
      R2_ACCESS_KEY_ID: ci-test-access-key
      R2_SECRET_ACCESS_KEY: ci-test-secret-key
      R2_BUCKET_NAME: ci-test-bucket
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @pantryai/shared build

      - name: Generate Prisma client
        run: pnpm --filter @pantryai/api exec prisma generate

      - name: Apply migrations to the test DB
        run: pnpm --filter @pantryai/api exec prisma migrate deploy

      # Runs both projects (unit + integration) under a single coverage run, so
      # the reported figure is the one for the whole API surface and not just the
      # unit slice. Thresholds from vitest.config.ts stay enforced.
      - name: Full suite + coverage (api)
        run: pnpm --filter @pantryai/api test:coverage

      - name: Upload coverage report (full suite)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-full
          path: packages/api/coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # next build needs this at build time; a placeholder is fine here.
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pantryai/api exec prisma generate

      - name: Turbo build
        run: pnpm run build
