name: Bug report
description: Report a bug, ideally tied to a cahier de recettes scenario
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. See docs/plan-de-correction-des-bogues.md for how
        we triage and close these.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Cahier de recettes scenario
      description: The scenario id this relates to, if any (for example CR-OCR-04).
      placeholder: CR-OCR-04
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps, in order.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: See the severity table in the bug-correction plan.
      options:
        - Bloquant
        - Majeur
        - Mineur
        - Cosmetique
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - auth
        - stock
        - ocr
        - web
        - mobile
        - infra
        - rgpd
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where it happened (local / production), browser or device, version or commit.
      placeholder: |
        - Environment: production
        - Client: Chrome 126 / iPhone 14
        - Version: v0.1.0
    validations:
      required: false
