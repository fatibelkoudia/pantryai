name: Bug report
description: Report something that does not work, so we can reproduce and fix it.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Fill in every field. The point is that someone else can reproduce the bug
        from this issue alone, without asking you anything. The fields below are the
        same ones as the consignation sheet in
        [plan-de-correction-des-bogues.md](../blob/master/docs/plan-de-correction-des-bogues.md).

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you doing when it happened, and how did you find it?
      placeholder: Running the CR-STOCK-07 acceptance scenario, editing an item from the mobile app...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      description: Which part of the app. Pick the one you saw it in.
      options:
        - API
        - Web app
        - Mobile app (Android APK)
        - OCR pipeline / receipt parsing
        - CI/CD or deployment
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release you were on, or the commit SHA if you were running it locally.
      placeholder: v1.0.0, or a97b322
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: What has to be true before the steps below make sense.
      placeholder: An existing stock item with location FRIDGE.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, in order, with the exact values you used.
      placeholder: |
        1. POST /stocks with location "FRIDGE"
        2. PATCH /stocks/:id with { "quantity": 5 } and no location
        3. GET /stocks/:id
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: location is still "FRIDGE".
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What really happened. If there is an error message or a stack trace, paste it.
      placeholder: location came back as "PANTRY" even though the PATCH never mentioned it.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: |
        Critical: the app is down or data is lost.
        High: a Must feature is broken, or data is silently wrong.
        Medium: a feature is degraded but there is a way around it.
        Low: cosmetic, or it only affects a rare case.
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: scenario
    attributes:
      label: Related acceptance scenario
      description: The CR-* ID from the cahier de recettes, if this came out of a test run.
      placeholder: CR-STOCK-07

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, a Sentry link, or a failing test. Drag files in here.
