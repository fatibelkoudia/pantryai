services:
  postgres_test:
    image: docker.io/library/postgres:17-alpine
    container_name: pantryai_postgres_test
    environment:
      POSTGRES_DB: pantryai_test
      POSTGRES_USER: pantryai
      POSTGRES_PASSWORD: pantryai
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pantryai -d pantryai_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: docker.io/library/redis:7-alpine
    container_name: pantryai_redis_test
    ports:
      - '6380:6379'
    tmpfs:
      - /data
