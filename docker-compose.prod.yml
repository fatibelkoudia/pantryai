# Self-hosted production stack for the PantryAI API. NOT what runs in production:
# the API runs on Railway, which builds packages/api/Dockerfile directly and needs
# none of this. Kept as a reference for running the full stack on a single host
# (API, worker, Redis, Nginx), and as the closest thing we have to a portable
# deployment. See docs/deployment.md for what actually runs.
#
# Postgres is NOT here on purpose: in production the database is Supabase, so we
# only run the API, a dedicated OCR worker, Redis (queue), and Nginx (SSL
# termination).
#
# Bring it up with:   docker compose -f docker-compose.prod.yml up -d --build
# Migrations run from the deploy pipeline before this (see docs/deployment.md).

services:
  redis:
    image: redis:7-alpine
    container_name: pantryai_redis_prod
    restart: unless-stopped
    # Not published to the host: only the API/worker reach it over the compose network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: pantryai-api:latest
    container_name: pantryai_api
    restart: unless-stopped
    env_file:
      - packages/api/.env
    environment:
      # Inside the compose network Redis is reachable by service name.
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PORT: '3001'
      # The API serves HTTP only. The OCR processor and the cron jobs run in the
      # worker container below, so the API opts out here (deviation D2 split).
      RUN_OCR_WORKER: 'false'
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '3001'
    healthcheck:
      # Hits the readiness route, which also pings Postgres and Redis.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Dedicated OCR worker: same image, no HTTP server. It's the only process with
  # RUN_OCR_WORKER=true, so it owns the OCR queue and the scheduled cron jobs
  # while the API stays free to serve requests (matches the deployment diagram).
  worker:
    image: pantryai-api:latest
    container_name: pantryai_worker
    restart: unless-stopped
    command: ['node', 'dist/worker']
    env_file:
      - packages/api/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RUN_OCR_WORKER: 'true'
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: pantryai_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/pantryai.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certs (e.g. from certbot) live on the host and are mounted in.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  redis_data:
