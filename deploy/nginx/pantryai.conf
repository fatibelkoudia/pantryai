# Nginx reverse proxy for the PantryAI API.
# It terminates SSL and forwards plain HTTP to the api container on :3001.
# Swap api.pantryai.example.com for the real domain.

upstream pantryai_api {
    server api:3001;
}

# Redirect all plain HTTP to HTTPS (keep the ACME path open for cert renewal).
server {
    listen 80;
    server_name api.pantryai.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pantryai.example.com;

    # Certs issued by certbot on the host and mounted into the container.
    ssl_certificate     /etc/letsencrypt/live/api.pantryai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pantryai.example.com/privkey.pem;

    # Reasonable modern TLS defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Receipt uploads can be up to 10 MB (matches the API's multipart limit).
    client_max_body_size 10m;

    # A couple of baseline security headers (the API also sets Helmet headers).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://pantryai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
